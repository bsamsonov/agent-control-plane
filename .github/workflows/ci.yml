name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: macp
          POSTGRES_PASSWORD: macp
          POSTGRES_DB: macp
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U macp -d macp"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      MACP_FAKE_LLM: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm migrate && pnpm seed
      - run: pnpm test
      - run: pnpm --filter @macp/web build

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/segment-py
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q
