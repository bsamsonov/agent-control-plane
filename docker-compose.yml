services:
  postgres:
    image: postgres:16-alpine
    container_name: macp-postgres
    environment:
      POSTGRES_USER: macp
      POSTGRES_PASSWORD: macp
      POSTGRES_DB: macp
    ports: ['5433:5432']
    volumes: ['macp-pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U macp -d macp']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  macp-pgdata:
